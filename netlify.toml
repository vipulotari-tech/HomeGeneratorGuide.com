# Netlify deploy configuration for HomeGeneratorGuide.com (static Astro output)
[build]
  command = "npm run build:production"
  publish = "dist"

[context.deploy-preview]
  command = "npm run build:staging"

[context.branch-deploy]
  command = "npm run build:staging"

# Retire the prohibited estimator URL without reintroducing an interactive tool.
[[redirects]]
  from = "/sizing/calculator/"
  to = "/sizing/what-size-generator-do-i-need/"
  status = 301
  force = true

[[redirects]]
  from = "/sizing/calculator"
  to = "/sizing/what-size-generator-do-i-need/"
  status = 301
  force = true

# Canonical host: apex. Redirect www -> apex for SEO consolidation.
[[redirects]]
  from = "https://www.homegeneratorguide.com/*"
  to = "https://homegeneratorguide.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
