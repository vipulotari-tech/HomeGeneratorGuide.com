name: Validate Astro Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Astro checks
        run: npm run check
      - name: TypeScript checks
        run: npm run typecheck
      - name: Planning math and evidence
        run: npm run test:planning && npm run validate:evidence
      - name: Build staging
        run: npm run build:staging
      - name: Staging indexing assertions
        run: node tools/qa-indexing.mjs staging
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start staging preview
        run: |
          npx wrangler dev --config wrangler.staging.jsonc --ip 127.0.0.1 --port 8321 > /tmp/hgg-wrangler.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hgg-wrangler.log
          exit 1
      - name: Browser QA
        env:
          BASE_URL: http://127.0.0.1:8321
        run: npm run qa:browser
      - name: Interactive and responsive QA
        env:
          BASE_URL: http://127.0.0.1:8321
        run: npm run qa:planners
      - name: Full functional audit
        env:
          BASE_URL: http://127.0.0.1:8321
        run: node tools/qa-functional.mjs
      - name: Build production
        run: npm run build:production
      - name: Production indexing assertions
        run: node tools/qa-indexing.mjs production
      - name: AdSense disclosure readiness
        run: node tools/qa-adsense-readiness.mjs
      - name: Full production HTML audit
        run: npm run qa:seo
      - name: Production SEO assertions
        run: |
          test -f dist/robots.txt
          grep -q "Allow: /" dist/robots.txt
          grep -q "https://homegeneratorguide.com/sitemap-index.xml" dist/robots.txt
          test -f dist/sitemap-index.xml
          ! grep -R -q "homegeneratorguide.com/404/" dist/sitemap*.xml
          ! grep -q "X-Robots-Tag: noindex" dist/_headers
